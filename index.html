<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarefa Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h1>Formulário Bootstrap</h1>
                <form class="needs-validation">
                    <div class="mb-3">
                        <label class="form-label" for="nome">Nome:</label>
                        <input required class="form-control" type="text" id="nome">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="email">E-mail:</label>
                        <input required class="form-control" type="email" id="email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="telefone">Telefone:</label>
                        <input required class="form-control" type="tel" id="telefone" aria-describedby="aviso-privacidade">
                        <div class="form-text" id="aviso-privacidade">Nós não compartilhamos os seus dados com ninguém</div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="exampleCheck1">
                        <label class="form-check-label" for="exampleCheck1">Eu aceito os termos de serviço</label>
                    </div>
                    <button class="btn btn-success" type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
