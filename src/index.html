<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo de Par ou Ímpar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Permanent+Marker&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="@@ENDERECO_DO_CSS">
    
</head>
<body>
    <main>
        <h1>Jogo de Par ou Ímpar</h1>
        <form id="form">
            <div>
                <label for="seu-numero">Escolha "Par" ou "Ímpar" e digite um número de 1 a 5:</label>
                <input type="number" id="seu-numero" required min="1" max="5">
            </div>
            <button type="submit">Preparar e já!</button>
        </form>
        <div class="resultado">
            <span id="numero-jogador"></span>
            <span id="numero-computador"></span>
            <span id="soma"></span>
            <span id="resultado"></span>
        </div>
    </main>
    <script src="@@ENDERECO_DO_JS"></script>
</body>
</html>
